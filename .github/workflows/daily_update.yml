name: Daily News & GD Generator

on:
  schedule:
    # Runs automatically at 00:30 UTC (6:00 AM IST) every single day
    - cron: '30 0 * * *'
  workflow_dispatch: # Lets you trigger a manual update with 1 click anytime

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run News Aggregator Script
        run: python evergreen_news_brief.py

      - name: Commit and Push updated HTML & Markdown
        run: |
          git config --global user.name "Daily News Bot"
          git config --global user.email "actions@github.com"
          git add index.html README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily brief" && git push)
